# Render.com Blueprint — Infrastructure as Code
# Deploy all services at once: https://render.com/docs/blueprint-spec
#
# Usage: Connect this repo on Render Dashboard → "New Blueprint Instance"
# Render auto-detects this file and provisions all services below.

services:
  - type: web
    name: incidentra-core
    runtime: docker
    dockerfilePath: ./render/core/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: incidentra-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: incidentra-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: incidentra-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: incidentra-redis
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: USE_SIMULATED_LOGS
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: TEMP_BLOCK_DURATION
        value: "86400"
      - key: RATE_LIMIT_WINDOW
        value: "60"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "10"
      - key: BRUTE_FORCE_THRESHOLD
        value: "10"

  - type: keyvalue
    name: incidentra-redis
    plan: free
    ipAllowList: []

databases:
  - name: incidentra-db
    plan: free
    databaseName: incidentra_db
